<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل هوش مصنوعی معلم مجازی | حسین لعلیان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--surface);
            padding-bottom: 20px;
        }

        h1 { color: var(--accent); margin-bottom: 10px; }
        .subtitle { color: var(--text-muted); font-size: 1.1rem; }

        .card {
            background: var(--surface);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: var(--text-muted); }
        
        select, textarea, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 1rem;
        }

        .btn {
            background: var(--primary);
            color: white;
            padding: 15px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover { background: #1d4ed8; }

        #output {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background: #0f172a;
            border-right: 4px solid var(--accent);
            min-height: 100px;
            white-space: pre-wrap;
        }

        footer { text-align: center; margin-top: 40px; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>پنل هوش مصنوعی انجام دهنده خواسته های معلم مجازی</h1>
        <p class="subtitle">حسین لعلیان؛ رتبه ۳۲ کنکور دکتری</p>
    </header>

    <div class="card">
        <div class="input-group">
            <label>مقطع و درس مورد نظر:</label>
            <select id="lesson">
                <option value="math">ریاضیات</option>
                <option value="physics">فیزیک</option>
                <option value="arabic">زبان عربی</option>
                <option value="english">زبان انگلیسی</option>
                <option value="other">سایر دروس</option>
            </select>
        </div>

        <div class="input-group">
            <label>بارگذاری عکس (صفحه کتاب یا جزوه):</label>
            <input type="file" id="fileInput" accept="image/*">
        </div>

        <div class="input-group">
            <label>متن سوال یا خواسته خود را بنویسید:</label>
            <textarea id="question" rows="4" placeholder="مثلاً: این متن عربی را ترجمه کن و ترکیب آن را توضیح بده..."></textarea>
        </div>

        <button class="btn" onclick="processAI()">
            <i class="fa-solid fa-magic"></i> ارسال به معلم مجازی
        </button>

        <div id="output">پاسخ هوشمند معلم مجازی در اینجا نمایش داده خواهد شد...</div>
    </div>

    <footer>
        <p>ارتباط با مدیریت و توسعه اختصاصی:</p>
        <p><a href="mailto:ai.algorithms.ballistics@gmail.com" style="color: var(--accent);">ai.algorithms.ballistics@gmail.com</a></p>
    </footer>
</div>

<script>
    function processAI() {
        const question = document.getElementById('question').value;
        const lesson = document.getElementById('lesson').value;
        const output = document.getElementById('output');

        if(!question) {
            alert("لطفاً سوال خود را بنویسید.");
            return;
        }

        output.innerText = "در حال پردازش درخواست شما در سیستم معلم مجازی...\n\n(در این نسخه استاتیک، این پنل آماده اتصال به API اصلی هوش مصنوعی است. برای عملکرد واقعی، لطفاً کد API Key را در بخش اسکریپت وارد کنید.)\n\nسوال شما: " + question;
        
        // در اینجا کد اتصال به API (OpenAI/Gemini) قرار می‌گیرد.
        // فعلاً به صورت یک ساختار آماده نمایش داده شد تا "الکی" پاسخ ندهد.
    }
</script>
</body>
</html>
