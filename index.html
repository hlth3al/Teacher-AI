<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher-AI | هوش مصنوعی معلم</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #10b981;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    header {
      text-align: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 1.8rem;
      color: var(--primary);
      margin-bottom: 0.25rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.85rem;
      font-size: 1rem;
      resize: vertical;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    .tools-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .btn {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.55rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .btn:hover {
      background-color: var(--border);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #0f172a;
      border: none;
      font-weight: bold;
      margin-right: auto;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      color: #fff;
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #imagePreviewContainer {
      display: none;
      position: relative;
      margin-top: 0.5rem;
      width: fit-content;
    }

    #imagePreview {
      max-width: 140px;
      max-height: 140px;
      border-radius: 8px;
      border: 1px solid var(--border);
      object-fit: cover;
    }

    .remove-img-btn {
      position: absolute;
      top: -6px;
      left: -6px;
      background: var(--danger);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .response-area {
      min-height: 160px;
      white-space: pre-wrap;
      line-height: 1.8;
      font-size: 1.05rem;
    }

    .status-text {
      color: var(--primary);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Teacher-AI دستیار هوشمند آموزشی</h1>
      <p>طرح سؤال متنی، بارگذاری تصویر و دریافت بی‌درنگ پاسخ</p>
    </header>

    <div class="card">
      <div class="input-group">
        <textarea id="questionInput" placeholder="پرسش یا مبحث درسی خود را اینجا بنویسید..."></textarea>

        <div id="imagePreviewContainer">
          <img id="imagePreview" src="" alt="پیش‌نمایش تصویر">
          <button type="button" class="remove-img-btn" onclick="clearSelectedImage()">×</button>
        </div>

        <div class="tools-bar">
          <!-- دکمه الصاق از وب / کلیپ‌بورد -->
          <button type="button" class="btn" onclick="pasteFromClipboard()">
            📋 الصاق از کلیپ‌بورد / وب
          </button>

          <!-- دکمه انتخاب تصویر از گالری -->
          <label class="btn" style="cursor: pointer;">
            🖼️ انتخاب تصویر از گالری
            <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImageSelection(event)">
          </label>

          <!-- دکمه ارسال سؤال -->
          <button type="button" class="btn btn-primary" id="submitBtn" onclick="askTeacherAI()">
            ارسال و دریافت پاسخ 🚀
          </button>
        </div>
      </div>
    </div>

    <div class="card">
      <div id="statusIndicator" class="status-text">در حال ارتباط با سرور هوش مصنوعی...</div>
      <div id="responseArea" class="response-area">پاسخ هوش مصنوعی در این قسمت نمایش داده خواهد شد.</div>
    </div>
  </div>

  <script>
    const AVALAI_API_KEY = "GAPGPTMASKTOKEN1tz853ii9bwX1X";
    let selectedImageBase64 = null;

    // تابع الصاق مستقیم متن از کلیپ‌بورد
    async function pasteFromClipboard() {
      try {
        const text = await navigator.clipboard.readText();
        const textarea = document.getElementById("questionInput");
        if (text) {
          textarea.value = textarea.value ? textarea.value + "\n" + text : text;
          textarea.focus();
        }
      } catch (err) {
        alert("لطفاً دسترسی به کلیپ‌بورد را تأیید کنید یا متن را دستی در کادر Paste نمایید.");
      }
    }

    // انتخاب تصویر و تبدیل به Base64
    function handleImageSelection(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        selectedImageBase64 = e.target.result;
        document.getElementById("imagePreview").src = selectedImageBase64;
        document.getElementById("imagePreviewContainer").style.display = "block";
      };
      reader.readAsDataURL(file);
    }

    // حذف تصویر انتخاب شده
    function clearSelectedImage() {
      selectedImageBase64 = null;
      document.getElementById("imageInput").value = "";
      document.getElementById("imagePreview").src = "";
      document.getElementById("imagePreviewContainer").style.display = "none";
    }

    // ارسال درخواست به هوش مصنوعی AvalAI
    async function askTeacherAI() {
      const question = document.getElementById("questionInput").value.trim();
      const responseArea = document.getElementById("responseArea");
      const statusIndicator = document.getElementById("statusIndicator");
      const submitBtn = document.getElementById("submitBtn");

      if (!question && !selectedImageBase64) {
        alert("لطفاً متنی بنویسید یا تصویری انتخاب کنید.");
        return;
      }

      // آماده‌سازی حالت لودینگ
      submitBtn.disabled = true;
      statusIndicator.style.display = "block";
      statusIndicator.textContent = "در حال پردازش و پاسخگویی توسط AvalAI...";
      responseArea.textContent = "";

      // ساخت محتوای پیام (پشتیبانی همزمان از متن و تصویر)
      let messageContent = [];
      if (question) {
        messageContent.push({ type: "text", text: question });
      }
      if (selectedImageBase64) {
        messageContent.push({
          type: "image_url",
          image_url: { url: selectedImageBase64 }
        });
      }

      // تعیین مدل مناسب (در صورت وجود تصویر مدل با قابلیت vision)
      const modelName = "gpt-4o-mini";

      try {
        const response = await fetch("https://api.avalai.ir/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + AVALAI_API_KEY
          },
          body: JSON.stringify({
            model: modelName,
            messages: [
              {
                role: "system",
                content: "شما یک استاد و معلم هوشمند آموزشی هستید. پاسخ‌های دقیق، علمی، ساختاریافته و به زبان فارسی ارائه دهید."
              },
              {
                role: "user",
                content: messageContent
              }
            ]
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || "خطا در دریافت پاسخ از سرور");
        }

        const answer = data.choices?.[0]?.message?.content || "پاسخی دریافت نشد.";
        responseArea.textContent = answer;
        statusIndicator.style.display = "none";

      } catch (err) {
        responseArea.textContent = "⚠️ خطایی رخ داد:\n" + err.message;
        statusIndicator.style.display = "none";
      } finally {
        submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
