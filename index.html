<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Teacher-AI | پلتفرم یکپارچه آموزشی</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap');
  :root{ --ink:#000; --card: rgba(255,255,255,.94); --stroke:#111; --shadow: 0 12px 28px rgba(0,0,0,.14); --radius: 22px; }
  *{ box-sizing:border-box; font-family:Vazirmatn, sans-serif; color:var(--ink) !important; }
  body{ margin:0; padding:18px 10px 40px; min-height:100vh; background:linear-gradient(135deg,#a8edea 0%,#fed6e3 45%,#d4fc79 100%); }
  .wrap{ max-width:920px; margin:0 auto; }
  .card{ background:var(--card); border:3px solid #ffcc00; border-radius:var(--radius); padding:18px; margin:14px 0; box-shadow:var(--shadow); }
  .title{ text-align:center; font-weight:900; font-size:22px; padding:14px; border:2px solid var(--stroke); border-radius:18px; background:linear-gradient(45deg,#ff6b6b,#4ecdc4,#ffe66d); }
  .status-box{ margin-top:14px; background:#f8f9fa; border:3px solid #2f3542; border-radius:18px; padding:16px; line-height:1.9; font-weight:800; }
  #systemMessage{ margin-top:12px; font-size:15px; white-space:pre-wrap; min-height:48px; background:#fff; border:2px solid #ced4da; border-radius:14px; padding:12px; }
  .btn{ border:3px solid var(--stroke); border-radius:18px; padding:14px; font-size:15px; font-weight:900; cursor:pointer; background:#fff; margin:6px; display:inline-flex; align-items:center; justify-content:center; }
  .text-area{ width:100%; min-height:85px; padding:12px; border:3px solid var(--stroke); border-radius:16px; font-size:15px; font-weight:800; background:#fff; margin-top:14px; resize:vertical; }
  .method-box{ background:#f1f2f6; border:2px solid var(--stroke); border-radius:16px; padding:14px; margin-top:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">Teacher-AI | پنل مدیریت هوش مصنوعی</div>
      <div class="status-box">
        <div id="systemMessage">🌀 وضعیت آماده است. سوال خود را بنویسید و دکمه پاسخ را بزنید.</div>
      </div>
      <textarea class="text-area" id="textQ" placeholder="پرسش یا تحلیل خود را اینجا بنویسید..."></textarea>
      <div style="text-align:center; margin-top:15px;">
        <button class="btn" onclick="executeQuery()">💡 دریافت پاسخ از هوش مصنوعی</button>
      </div>
      <div id="pricingSection" style="margin-top:20px;">
        <div class="method-box">
          <div style="font-weight:900;">۱. آفلاین (واریز به حساب شرکت و ارسال رسید)</div>
          مبلغ بسته را به حساب رسمی شرکت واریز کرده و تصویر فیش را به ایمیل زیر ارسال فرمایید:<br>
          <code>AI.Algorithms.Ballistics@gmail.com</code>
        </div>
      </div>
    </div>
  </div>

  <script>
    // کلید را اینجا وارد کنید (امنیت این روش در محیط شخصی است)
    const AI_API_KEY = ""; 

    async function executeQuery(){
      const userText = document.getElementById("textQ").value.trim();
      const msgEl = document.getElementById("systemMessage");
      const key = AI_API_KEY.trim();

      if(!userText){ msgEl.textContent = "⚠️ لطفاً متن سوال را وارد کنید."; return; }
      if(!key){ msgEl.textContent = "⚠️ خطا: کلید API تنظیم نشده است. لطفاً در کد به متغیر AI_API_KEY مقدار دهید."; return; }

      msgEl.textContent = "🌀 در حال پردازش توسط هوش مصنوعی...";

      try {
        const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + key,
            "Content-Type": "application/json",
            "HTTP-Referer": "https://teacher-ai.local"
          },
          body: JSON.stringify({
            model: "google/gemini-2.0-flash-exp:free",
            messages: [{role: "user", content: userText}]
          })
        });

        if(!res.ok){
          throw new Error("ارتباط با سرور برقرار نشد (کد: " + res.status + ")");
        }

        const data = await res.json();
        if(data.choices && data.choices[0]){
          msgEl.textContent = "✅ پاسخ هوش مصنوعی:\n\n" + data.choices[0].message.content;
        } else {
          throw new Error("پاسخ نامعتبر از سمت سرور");
        }
      } catch(err) {
        msgEl.textContent = "❌ خطا در دریافت پاسخ: " + err.message + "\n\nلطفاً از صحت اتصال اینترنت و معتبر بودن کلید API اطمینان حاصل فرمایید.";
      }
    }
  </script>
</body>
</html>
