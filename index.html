<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل هوش مصنوعی معلم مجازی | حسین لعلیان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --error: #ef4444;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--surface);
            padding-bottom: 15px;
        }

        h1 { color: var(--accent); font-size: 1.35rem; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.9rem; }
        
        select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.2s ease-in-out;
        }

        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #475569; cursor: not-allowed; }

        #output {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #0f172a;
            border-right: 4px solid var(--accent);
            min-height: 80px;
            white-space: pre-wrap;
            line-height: 1.8;
            font-size: 0.95rem;
        }

        footer { 
            text-align: center; 
            margin-top: 30px; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            border-top: 1px solid #1e293b;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>پنل هوش مصنوعی انجام‌دهنده خواسته‌های معلم مجازی</h1>
        <p class="subtitle">حسین لعلیان؛ رتبه ۳۲ کنکور دکتری</p>
    </header>

    <div class="card">
        <div class="input-group">
            <label><i class="fa-solid fa-book-open"></i> انتخاب درس تخصصی:</label>
            <select id="lesson">
                <option value="عربی">زبان و ادبیات عربی (ترجمه، اعراب‌گذاری و صرف و نحو)</option>
                <option value="ریاضیات و فیزیک">ریاضیات و فیزیک (محاسبات، تشریح و حل مسئله)</option>
                <option value="انگلیسی">زبان انگلیسی (ترجمه و گرامر)</option>
                <option value="ادبیات فارسی">ادبیات فارسی (آرایه‌ها، دستور زبان و معنی)</option>
                <option value="عمومی">سایر دروس و مباحث علمی</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-pen-to-square"></i> متن سوال یا مبحث مورد نظر:</label>
            <textarea id="question" rows="4" placeholder="مثال: معنی تَعْلَمُونَ چیست و صیغه و ریشه آن را مشخص کن..."></textarea>
        </div>

        <button id="submitBtn" class="btn" onclick="askTeacherAI()">
            <i class="fa-solid fa-robot"></i> دریافت پاسخ هوشمند معلم مجازی
        </button>

        <div id="output">پاسخ تحلیلی معلم مجازی در این قسمت ظاهر خواهد شد...</div>
    </div>

    <footer>
        <p>ارتباط با مدیریت و توسعه اختصاصی سامانه‌ها:</p>
        <p><a href="mailto:ai.algorithms.ballistics@gmail.com" style="color: var(--accent); text-decoration: none;">ai.algorithms.ballistics@gmail.com</a></p>
    </footer>
</div>

<script>
    async function askTeacherAI() {
        const question = document.getElementById('question').value.trim();
        const lesson = document.getElementById('lesson').value;
        const output = document.getElementById('output');
        const btn = document.getElementById('submitBtn');

        if (!question) {
            alert("لطفاً سوال یا مسئله خود را بنویسید.");
            return;
        }

        output.innerText = "⏳ در حال پردازش سوال توسط هوش مصنوعی...";
        btn.disabled = true;

        const fullPrompt = `شما یک معلم باحوصله و متخصص درس ${lesson} هستید. لطفا به این سوال دانش‌آموز به زبان فارسی کامل، رسا و گام‌به‌گام پاسخ بده:\n${question}`;

        try {
            // روش اول: اتصال مستقیم به موتور سریع duckduckgo / mistral
            const res = await fetch("https://text.pollinations.ai/" + encodeURIComponent(fullPrompt) + "?model=mistral");
            if (res.ok) {
                const text = await res.text();
                if (!text.includes("budget") && !text.includes("API key")) {
                    output.innerText = text;
                    btn.disabled = false;
                    return;
                }
            }
            throw new Error("سوییچ به سرور دوم");
        } catch (err1) {
            try {
                // روش جایگزین: سرور دوم با مدل llama
                const res2 = await fetch("https://text.pollinations.ai/" + encodeURIComponent(fullPrompt) + "?model=llama");
                if (res2.ok) {
                    const text2 = await res2.text();
                    if (!text2.includes("budget") && !text2.includes("API key")) {
                        output.innerText = text2;
                        btn.disabled = false;
                        return;
                    }
                }
                throw new Error("سوییچ به سرور سوم");
            } catch (err2) {
                try {
                    // روش جایگزین سرور عمومی پایدار
                    const res3 = await fetch("https://html-preview.github.io/?url=" + encodeURIComponent(fullPrompt));
                    output.innerText = "پاسخ دریافت نشد. لطفاً چند لحظه بعد دکمه را بزنید.";
                } catch(err3) {
                    output.innerText = "پاسخ هوشمند در دسترس نیست. لطفاً مجدداً امتحان نمایید.";
                }
            }
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
