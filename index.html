<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل هوش مصنوعی معلم مجازی | حسین لعلیان</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --border: #334155;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 15px;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--surface);
            padding-bottom: 15px;
        }

        h1 { color: var(--accent); font-size: 1.35rem; margin-bottom: 8px; }
        .subtitle { color: var(--text-muted); font-size: 0.95rem; margin: 0; }

        .card {
            background: var(--surface);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: var(--text-muted); font-size: 0.9rem; }
        
        select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #0f172a;
            color: white;
            font-size: 0.95rem;
            outline: none;
        }

        select:focus, textarea:focus {
            border-color: var(--accent);
        }

        .btn {
            background: var(--primary);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            width: 100%;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn:hover { background: #1d4ed8; }
        .btn:disabled { background: #475569; cursor: not-allowed; }

        #output {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            background: #0f172a;
            border-right: 4px solid var(--accent);
            min-height: 80px;
            white-space: pre-wrap;
            line-height: 1.9;
            font-size: 0.95rem;
        }

        footer { 
            text-align: center; 
            margin-top: 30px; 
            color: var(--text-muted); 
            font-size: 0.85rem; 
            border-top: 1px solid #1e293b;
            padding-top: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>پنل هوش مصنوعی انجام‌دهنده خواسته‌های معلم مجازی</h1>
        <p class="subtitle">حسین لعلیان؛ رتبه ۳۲ کنکور دکتری</p>
    </header>

    <div class="card">
        <div class="input-group">
            <label><i class="fa-solid fa-book-open"></i> انتخاب درس تخصصی:</label>
            <select id="lesson">
                <option value="علوم تجربی و زمین‌شناسی">علوم تجربی و زمین‌شناسی</option>
                <option value="عربی">زبان و ادبیات عربی (ترجمه و صرف و نحو)</option>
                <option value="ریاضیات و فیزیک">ریاضیات و فیزیک (محاسبات و حل مسئله)</option>
                <option value="انگلیسی">زبان انگلیسی (ترجمه و گرامر)</option>
                <option value="ادبیات فارسی">ادبیات فارسی</option>
                <option value="عمومی">سایر علوم و مباحث درسی</option>
            </select>
        </div>

        <div class="input-group">
            <label><i class="fa-solid fa-pen-to-square"></i> متن سوال یا مبحث مورد نظر:</label>
            <textarea id="question" rows="4" placeholder="هر سوالی در هر زمینه‌ای دارید بنویسید (مثلاً: سنگ آذرین چیست؟ یا هاذان یعنی چه؟)..."></textarea>
        </div>

        <button id="submitBtn" class="btn" onclick="askAI()">
            <i class="fa-solid fa-robot"></i> دریافت پاسخ هوشمند معلم مجازی
        </button>

        <div id="output">پاسخ تحلیلی معلم مجازی در این قسمت ظاهر خواهد شد...</div>
    </div>

    <footer>
        <p>ارتباط با مدیریت و توسعه اختصاصی سامانه‌ها:</p>
        <p><a href="mailto:ai.algorithms.ballistics@gmail.com" style="color: var(--accent); text-decoration: none;">ai.algorithms.ballistics@gmail.com</a></p>
    </footer>
</div>

<script>
    async function askAI() {
        const q = document.getElementById('question').value.trim();
        const lesson = document.getElementById('lesson').value;
        const output = document.getElementById('output');
        const btn = document.getElementById('submitBtn');

        if (!q) {
            alert("لطفاً ابتدا سوال خود را بنویسید.");
            return;
        }

        output.innerText = "⏳ در حال اتصال به هوش مصنوعی و تدوین پاسخ کامل علمی...";
        btn.disabled = true;

        const systemPrompt = `شما یک معلم مجازی و استاد دلسوز در درس ${lesson} هستید. لطفا به این سوال به زبان فارسی روان، علمی، جامع و دقیق پاسخ بده:\n${q}`;

        // لیست اندپوینت‌های هوش مصنوعی زنده و بدون فیلتر با قابلیت سوئیچ خودکار
        const endpoints = [
            {
                url: "https://text.pollinations.ai/",
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    messages: [
                        { role: "system", content: `شما استاد و معلم متخصص درس ${lesson} هستید. پاسخ‌ها را دقیق، کامل، مستدل و به زبان فارسی بنویسید.` },
                        { role: "user", content: q }
                    ],
                    model: "searchgpt",
                    jsonMode: false
                })
            },
            {
                url: "https://text.pollinations.ai/" + encodeURIComponent(systemPrompt) + "?model=searchgpt&seed=" + Math.floor(Math.random() * 1000),
                method: "GET",
                headers: {}
            },
            {
                url: "https://text.pollinations.ai/" + encodeURIComponent(systemPrompt) + "?model=unity&seed=" + Math.floor(Math.random() * 1000),
                method: "GET",
                headers: {}
            }
        ];

        let answered = false;

        for (const ep of endpoints) {
            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 12000);

                const opts = {
                    method: ep.method,
                    headers: ep.headers,
                    signal: controller.signal
                };
                if (ep.body) opts.body = ep.body;

                const response = await fetch(ep.url, opts);
                clearTimeout(timeout);

                if (response.ok) {
                    const text = await response.text();
                    if (text && text.trim().length > 15 && !text.includes("budget") && !text.includes("API key")) {
                        output.innerText = text.trim();
                        answered = true;
                        break;
                    }
                }
            } catch (err) {
                // اگر این سرور پاسخ نداد به بعدی سوئیچ می‌شود
                continue;
            }
        }

        if (!answered) {
            output.innerText = "⚠️ خطای موقت شبکه در اتصال به سرورهای هوش مصنوعی رخ داد. لطفاً فیلترشکن خود را بررسی کرده یا مجدداً روی دکمه کلیک کنید.";
        }

        btn.disabled = false;
    }
</script>
</body>
</html>
