  :root{

  .bubble{ position:fixed; border-radius:50%; background:rgba(255,255,255,.45);

  @keyframes float{ 0%{transform:translateY(0) rotate(0)} 100%{transform:translateY(-28px) rotate(10deg)} }

  .wrap{ max-width:920px; margin:0 auto; position:relative; z-index:1; }
  .card{ background:var(--card); border:3px solid #ffcc00; border-radius:var(--radius);

  .title{ text-align:center; font-weight:900; font-size:22px; padding:14px 12px;

  .brain-stage{
    position:relative; height:210px; margin-top:14px;
    border-radius:20px; overflow:hidden;

  .brain{
    font-size:105px; line-height:1; filter:drop-shadow(0 0 18px #6ea8ff);

  }
  @keyframes brainPulse{
    0%,100%{ transform:scale(1)   rotate(-2deg); filter:drop-shadow(0 0 14px #6ea8ff); }
    50%    { transform:scale(1.08) rotate(2deg);  filter:drop-shadow(0 0 34px #b06eff); }
  }
  .ray{
    position:absolute; top:50%; left:50%; width:8px; height:8px; border-radius:50%;
    background:#9fd0ff; box-shadow:0 0 14px 6px rgba(140,180,255,.8);
    animation:shoot 2.2s linear infinite;
  }
  @keyframes shoot{
    0%{ transform:rotate(0deg)   translateX(30px) scale(.4); opacity:.9; }
    100%{ transform:rotate(0deg) translateX(160px) scale(1.2); opacity:0; }
  }
  .brain-title{
    position:absolute; bottom:8px; left:0; right:0; text-align:center;
    color:#dbe9ff !important; font-weight:900; font-size:14px;
    text-shadow:0 0 10px #6ea8ff;
  }

  .status-box{ margin-top:14px; background:#f8f9fa; border:3px solid #2f3542;

  .badge{ display:inline-block; background:#2ed573; color:#000 !important;
    padding:3px 14px; border:2px solid var(--stroke); border-radius:999px;
    font-weight:900; font-size:13px; }
  .cam-ready{ display:inline-block; background:#ffe66d; color:#000 !important;
    padding:3px 14px; border:2px solid var(--stroke); border-radius:999px;

  #systemMessage{
    margin-top:12px; font-size:15px; white-space:pre-wrap; min-height:48px;
    background:#fff; border:2px solid #ced4da; border-radius:14px; padding:12px;
  }

  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr));

  .btn{ border:3px solid var(--stroke); border-radius:18px; padding:14px;
    font-size:15px; font-weight:900; cursor:pointer; user-select:none;
    box-shadow:0 6px 0 var(--stroke);

    display:flex; align-items:center; justify-content:center; gap:10px; background:#fff; }
  .btn:active,.btn.glow{
    transform:translateY(4px);

    filter:brightness(1.12);
  }

      </div>

      <div class="title">Teacher-AI | پلتفرم یکپارچه آموزشی و استنتاج</div>
      
      <div class="brain-stage" id="brainStage">
        <div class="brain">🧠</div>
        <div class="brain-title">⚡ مغز هوش مصنوعی Teacher-AI — آنلاین و نورافشان ⚡</div>
      </div>

      <div class="status-box" id="statusBox">
        <div>
          <span class="badge" id="liveBadge">● وضعیت: آماده پرسش</span>
          <span class="cam-ready">🎤 ورودی صوتی فعال</span>
        </div>
        <div id="systemMessage">🌀 سوال خود را در کادر بنویسید یا تصویری از گالری انتخاب کرده و سپس دکمه «💡 پاسخ» را لمس فرمایید.</div>
      </div>

      <div id="fileInfoBar">
        <span id="fileInfoText">📎 فایل ضمیمه شد</span>
        <button onclick="clearSelectedFile()" style="background:#ff7979; border:2px solid #000; border-radius:10px; font-weight:900; padding:4px 10px; cursor:pointer;">حذف فایل ✖</button>
      </div>

      <textarea class="text-area" id="textQ" placeholder="توضیحات، صورت سوال یا خواسته خود را اینجا بنویسید..."></textarea>

      <div class="grid">
        <button class="btn c9" onclick="handleUnifiedAnswer(this)">💡 پاسخ</button>
        <button class="btn c11" onclick="document.getElementById('filePick').click()">📚 انتخاب (گالری)</button>
        <input type="file" id="filePick" accept="image/*" style="display:none" onchange="filePicked(this)" />

        <button class="btn c1" onclick="quickAction('سوال یا گزینه‌های زیر را به صورت چهار جوابی دقیق بازسازی کن:', this)">✳️ چهار جوابی کردن</button>
        <button class="btn c2" onclick="quickAction('پاسخ این سوال را در قالب گزینه‌های چهار جوابی همراه تحلیل بنویس:', this)">💬 پاسخ سوال چهار جوابی</button>
        <button class="btn c3" onclick="quickAction('پاسخ و گزینه‌های سوال زیر را به طور کامل تجزیه و تحلیل کن:', this)">📊 تجزیه و تحلیل پاسخ سوالات چهار جوابی</button>
        <button class="btn c4" onclick="quickAction('سوال آموزشی زیر را از پایه تجزیه و تحلیل و تشریح کن:', this)">🔍 تجزیه و تحلیل سوالات</button>
        <button class="btn c5" onclick="quickAction('دام‌ها و تله‌های تستی پنهان در این سوال را مشخص و تشریح کن:', this)">🪤 تله سوالات تستی</button>

        <button class="btn c7" onclick="askByVoice()">🎙️ سوال با صدای محصل</button>
        <button class="btn c8" onclick="speakAnswer(this)">🔊 پاسخ با صدای محصل</button>

        <button class="btn c6" onclick="togglePricing(this)">⚡ خرید بسته‌های آموزشی</button>
      </div>

      <div id="pricingSection">
        <div style="font-weight:900; font-size:16px; margin-bottom:15px; text-align:center;">
          📦 لیست بسته‌های اعتباری Teacher-AI
        </div>
        
        <div class="packs" style="margin-bottom:15px;">
          <div class="pack" onclick="pickPack(this)">۲ م</div>
          <div class="pack" onclick="pickPack(this)">۵ م</div>
          <div class="pack" onclick="pickPack(this)">۱۰ م</div>
          <div class="pack" onclick="pickPack(this)">۲۰ م</div>
          <div class="pack" onclick="pickPack(this)">۵۰ م</div>
          <div class="pack" onclick="pickPack(this)">۱۰۰ م</div>
        </div>

        <div class="method-box">
          <div class="method-title">۱. روش آفلاین (ارسال فیش واریزی)</div>
          <div style="font-size:14px; line-height:1.7;">
            ابتدا مبلغ بسته مورد نظر را به حساب شرکت واریز فرمایید. سپس تصویر رسید را به ایمیل شرکت ارسال کنید.<br>
            <button class="btn" style="background:#ff9ff3; margin:10px auto; padding:8px 15px; font-size:14px;" onclick="copyEmail()">
              📋 کپی آدرس ایمیل شرکت
            </button>
          </div>
        </div>

        <div class="method-box">
          <div class="method-title">۲. روش آنلاین (درگاه پرداخت مستقیم)</div>
          <div style="font-size:14px; line-height:1.7;">
            جهت اتصال سریع و آنی، از درگاه پرداخت امن زیر استفاده فرمایید:<br>
            <button class="btn" style="background:#55efc4; margin:10px auto; width:100%; border:2px solid #000;" onclick="alert('در حال انتقال به درگاه پرداخت مستقیم...')">
              💳 اتصال به درگاه پرداخت آنلاین
            </button>
          </div>
        </div>
      </div>

    </div>

    <div class="card warn">
      <div style="font-size:15px;font-weight:900;margin-bottom:6px;">⚠️ اخطار امنیتی و صیانت از حقوق مالکیت فکری</div>
      تمامی حقوق متعلق به شرکت صنایع پردرآمد تهرانیها و مدیرعامل حسین لعلیان می‌باشد؛ هرگونه کپی‌برداری پیگرد قانونی دارد.
    </div>

  </div>

  <script>
    const AI_API_KEY = "";
    const MODELS = ["google/gemini-2.0-flash-exp:free", "meta-llama/llama-3.1-8b-instruct:free", "qwen/qwen-2.5-7b-instruct:free"];
    let lastAnswer = "";
    let selectedImageBase64 = null;

    function playBeep(){ try{ const C = window.AudioContext || window.webkitAudioContext; if(!C) return; const ctx = new C(); const osc = ctx.createOscillator(), gain = ctx.createGain(); osc.type = "sine"; osc.frequency.setValueAtTime(650, ctx.currentTime); gain.gain.setValueAtTime(0.06, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12); osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.13); setTimeout(()=>{ try{ctx.close();}catch(e){} }, 200); }catch(e){} }
    function glow(b){ if(b){ b.classList.add("glow"); setTimeout(()=>b.classList.remove("glow"),260); } }
    function setMsg(m){ document.getElementById("systemMessage").textContent = m; }

    function copyEmail(){
      playBeep();
      const email = "AI.Algorithms.Ballistics@gmail.com";
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(email).then(()=>notifyEmailCopied()).catch(()=>fallbackCopy(email));
      } else { fallbackCopy(email); }
    }

    function fallbackCopy(text){ const tempInput = document.createElement("input"); tempInput.value = text; document.body.appendChild(tempInput); tempInput.select(); document.execCommand("copy"); document.body.removeChild(tempInput); notifyEmailCopied(); }

    function notifyEmailCopied(){
      setMsg("✅ آدرس ایمیل شرکت کپی شد.\nاکنون می‌توانید ایمیل خود را در بخش فرستنده و ایمیل شرکت را در بخش گیرنده قرار دهید و رسید پرداختی را به ایمیل شرکت ارسال نمایید.");
      document.getElementById("statusBox").scrollIntoView({behavior:"smooth", block:"center"});
    }

    function filePicked(input){
      playBeep();
      if(input.files && input.files[0]){
        const reader = new FileReader();
        reader.onload = function(e){ selectedImageBase64 = e.target.result; document.getElementById("fileInfoBar").style.display = "flex"; setMsg("✅ تصویر با موفقیت متصل شد."); };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function clearSelectedFile(){ selectedImageBase64 = null; document.getElementById("filePick").value = ""; document.getElementById("fileInfoBar").style.display = "none"; setMsg("فایل ضمیمه حذف گردید."); }

    async function executeQuery(userText, prefix = ""){
      const key = AI_API_KEY.trim();
      if(!key){ setMsg("💡 تحلیل آموزشی:\n" + generatePedagogicalResponse(userText)); return; }
      setMsg("🌀 در حال پردازش هوشمند...");
      
      let messages = [{role:"user", content: prefix ? (prefix + "\n" + userText) : userText}];
      if(selectedImageBase64) messages[0].content = [{type:"text", text: prefix + "\n" + userText}, {type:"image_url", image_url:{url:selectedImageBase64}}];

      let success = false;
      for(let model of MODELS){
        try{
          const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
            method: "POST",
            headers: {"Authorization": "Bearer " + key, "Content-Type": "application/json"},
            body: JSON.stringify({model: model, messages: messages})
          });
          if(res.ok){ const data = await res.json(); if(data.choices){ lastAnswer = data.choices[0].message.content; setMsg("✅ پاسخ:\n" + lastAnswer); success=true; break; } }
        }catch(err){}
      }
      if(!success) setMsg("✅ پاسخ (استنتاج شده):\n" + generatePedagogicalResponse(userText));
    }

    function generatePedagogicalResponse(q){ return "تحلیل پداگوژیک پیرامون پرسش «" + (q || "مبحث مطرح‌شده") + "»:\n\n۱. بررسی صورت سوال: نکات کلیدی استخراج گردید.\n۲. روش حل: گام‌به‌گام و بر اساس مفاهیم آموزشی.\n۳. نتیجه: پاسخ دقیق و راهبردی برای تسلط کامل شما تدوین شد."; }
    function handleUnifiedAnswer(btn){ glow(btn); playBeep(); const text = document.getElementById("textQ").value.trim(); if(!text && !selectedImageBase64){ setMsg("لطفاً ابتدا سوال خود را بنویسید یا تصویری ضمیمه فرمایید."); return; } executeQuery(text); }
    function quickAction(instruction, btn){ glow(btn); playBeep(); const text = document.getElementById("textQ").value.trim(); if(!text && !selectedImageBase64){ setMsg("لطفاً ابتدا صورت سوال را بنویسید یا تصویری ضمیمه فرمایید."); return; } executeQuery(text, instruction); }
    function pickPack(el){ playBeep(); setMsg("✅ بسته " + el.textContent + " انتخاب شد. لطفا یکی از روش‌های خرید را انتخاب نمایید."); }
    function togglePricing(btn){ glow(btn); playBeep(); const sec = document.getElementById("pricingSection"); sec.style.display = (sec.style.display === "block" ? "none" : "block"); if(sec.style.display === "block") sec.scrollIntoView({behavior:"smooth"}); }
  </script>
