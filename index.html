<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher-AI</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-top: 0; }
        #chatBox { height: 400px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; margin-bottom: 15px; border-radius: 8px; background: #fafafa; }
        .message { margin-bottom: 12px; padding: 10px; border-radius: 8px; line-height: 1.5; }
        .user { background: #dcf8c6; text-align: right; margin-left: 20px; }
        .ai { background: #e8e8e8; text-align: right; margin-right: 20px; color: #333; }
        .input-group { display: flex; gap: 5px; }
        input { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>Teacher-AI</h2>
    <div id="chatBox"></div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="سوال خود را بنویسید...">
        <button onclick="sendMessage()">ارسال</button>
    </div>
</div>

<script>
    // کلید شما در اینجا تنظیم شده است
    const API_KEY = "GAPGPTMASKTOKENntdmqh8v4eX1X";
    const chatBox = document.getElementById("chatBox");
    const userInput = document.getElementById("userInput");

    function appendMsg(text, isUser) {
        chatBox.innerHTML += `<div class="message ${isUser ? 'user' : 'ai'}">${isUser ? 'شما: ' : 'AI: '}${text}</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;
        
        appendMsg(text, true);
        userInput.value = "";
        
        try {
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "Content-Type": "application/json",
                    "HTTP-Referer": "https://github.com/hlth3al/Teacher-AI",
                    "X-Title": "Teacher-AI"
                },
                body: JSON.stringify({
                    "model": "google/gemma-2-9b-it:free",
                    "messages": [{"role": "user", "content": text}]
                })
            });
            
            const data = await response.json();
            if (data.choices) {
                appendMsg(data.choices[0].message.content, false);
            } else {
                appendMsg("خطا: " + JSON.stringify(data.error), false);
            }
        } catch (e) {
            appendMsg("خطای اتصال. لطفا اینترنت خود را چک کنید.", false);
        }
    }

    // ارسال با اینتر
    userInput.addEventListener("keypress", (e) => { if(e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
