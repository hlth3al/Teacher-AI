<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سامانه هوشمند تحلیل متون آموزشی</title>
  <style>
    :root { --bg: #0b0f19; --card: #121826; --border: #232d42; --primary: #3b82f6; --text: #e2e8f0; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; color: #60a5fa; margin-bottom: 20px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .file-dropzone { border: 2px dashed var(--border); padding: 20px; text-align: center; cursor: pointer; border-radius: 8px; margin-bottom: 15px; }
    textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-bottom: 15px; }
    .mode-selector { display: flex; gap: 10px; margin-bottom: 15px; }
    .mode-btn { flex: 1; padding: 12px; background: #1e293b; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; text-align: center; }
    .mode-btn.active { background: #1d4ed8; font-weight: bold; }
    .submit-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }
    .output-box { background: #090d16; border: 1px solid #1e293b; border-radius: 8px; padding: 20px; min-height: 150px; white-space: pre-wrap; }
  </style>
</head>
<body>

<div class="container">
  <h1>سامانه تحلیل هوشمند متون</h1>

  <div class="card">
    <div class="file-dropzone" onclick="document.getElementById('imageInput').click()">
      <span id="uploadText">📷 انتخاب تصویر صفحه کتاب</span>
      <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImage(this)">
    </div>

    <textarea id="textContent" rows="2" placeholder="یا متن صفحه را اینجا بنویسید..."></textarea>

    <div class="mode-selector">
      <div class="mode-btn active" id="btnModeEssay" onclick="setMode('essay')">سوالات تشریحی و راهنما</div>
      <div class="mode-btn" id="btnModeQuiz" onclick="setMode('quiz')">آزمون چهارگزینه‌ای</div>
    </div>

    <button class="submit-btn" id="runBtn" onclick="processData()">تحلیل و دریافت خروجی</button>
  </div>

  <div class="card">
    <div id="statusIndicator" style="margin-bottom: 10px; color: #94a3b8; font-size: 0.9rem;">آماده تحلیل...</div>
    <div class="output-box" id="outputContent">نتایج در این قسمت نمایش داده می‌شود.</div>
  </div>
</div>

<script>
  // --- کلید خود را در جای خالی زیر قرار دهید ---
  const CONFIG_KEY = "sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"; 
  // ---------------------------------------------

  let selectedMode = 'essay';
  let base64Image = null;

  function setMode(mode) {
    selectedMode = mode;
    document.getElementById('btnModeEssay').classList.toggle('active', mode === 'essay');
    document.getElementById('btnModeQuiz').classList.toggle('active', mode === 'quiz');
  }

  function handleImage(input) {
    const file = input.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = e => {
        base64Image = e.target.result;
        document.getElementById('uploadText').innerText = 'تصویر انتخاب شد: ' + file.name;
      };
      reader.readAsDataURL(file);
    }
  }

  async function processData() {
    const textContent = document.getElementById('textContent').value;
    const outBox = document.getElementById('outputContent');
    const status = document.getElementById('statusIndicator');
    const runBtn = document.getElementById('runBtn');

    if (!base64Image && !textContent) return alert('لطفاً تصویر یا متن را وارد کنید');

    runBtn.disabled = true;
    status.innerText = 'در حال تحلیل و پردازش...';
    outBox.innerText = 'منتظر باشید...';

    const systemPrompt = selectedMode === 'essay' 
      ? "صفحه کتاب را تحلیل کن. ۳ تا ۵ سوال تشریحی مهم استخراج کن. برای هر سوال پاسخ کامل و مرحله به مرحله بنویس."
      : "صفحه کتاب را تحلیل کن. ۴ سوال تستی استاندارد طراحی کن. پاسخ صحیح را مشخص کن و دلیل درستی و غلط بودن گزینه‌ها را توضیح بده.";

    try {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${CONFIG_KEY}`
        },
        body: JSON.stringify({
          model: "gpt-4o-mini",
          messages: [
            { role: "system", content: systemPrompt },
            { role: "user", content: [
                { type: "text", text: textContent || "تحلیل صفحه کتاب:" },
                ...(base64Image ? [{ type: "image_url", image_url: { url: base64Image } }] : [])
            ]}
          ]
        })
      });

      const data = await response.json();
      outBox.innerText = data.choices[0].message.content;
      status.innerText = 'تحلیل با موفقیت انجام شد.';
    } catch (err) {
      outBox.innerText = 'خطا در برقراری ارتباط. لطفاً اتصال خود را بررسی کنید.';
      status.innerText = 'بروز خطا';
    } finally {
      runBtn.disabled = false;
    }
  }
</script>

</body>
</html>
