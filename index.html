<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher-AI | سامانه معلم مجازی هوشمند</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; direction: rtl; text-align: right; }
        .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; font-size: 24px; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .chat-box { height: 400px; border: 1px solid #ddd; border-radius: 8px; padding: 15px; overflow-y: scroll; background: #fafafa; margin-bottom: 15px; }
        .message { margin-bottom: 12px; padding: 10px 14px; border-radius: 8px; line-height: 1.6; max-width: 80%; }
        .user { background: #d4efdf; margin-right: auto; text-align: right; }
        .ai { background: #ebf5fb; margin-left: auto; text-align: left; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        button { background: #3498db; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background: #2980b9; }
        .footer { margin-top: 20px; font-size: 12px; color: #7f8c8d; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Teacher-AI | سامانه یکپارچه آموزشی و استنتاج پداگوژیک</h1>
    <p>مدیرعامل: حسین لعلیان (رتبه ۳۲ دکتری) - شرکت صنایع پردرآمد تهرانیها</p>

    <div class="chat-box" id="chatBox">
        <div class="message ai">سلام! من معلم مجازی شما هستم. سوال درسی‌تان را بپرسید تا راهنمایی‌تان کنم.</div>
    </div>

    <div class="input-group">
        <input type="text" id="userInput" placeholder="سوال خود را اینجا بنویسید..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">ارسال</button>
    </div>

    <div class="footer">
        تمامی حقوق متعلق به شرکت صنایع پردرآمد تهرانیها می‌باشد.
    </div>
</div>

<script>
    // کلید OpenRouter شما
    const API_KEY = "GAPGPTMASKTOKENeq6tg9ps5zvX1X";
    const URL = "https://openrouter.ai/api/v1/chat/completions";

    let messages = [
        { role: "system", content: "You are an expert, polite, and helpful virtual teacher for students in Iran, speaking in Persian." }
    ];

    async function sendMessage() {
        const inputField = document.getElementById("userInput");
        const chatBox = document.getElementById("chatBox");
        const text = inputField.value.trim();
        if (!text) return;

        // نمایش پیام کاربر
        chatBox.innerHTML += `<div class="message user">${text}</div>`;
        inputField.value = "";
        chatBox.scrollTop = chatBox.scrollHeight;

        messages.push({ role: "user", content: text });

        // پیام در حال بارگذاری
        const loadingId = "loading_" + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" class="message ai">در حال استنتاج پداگوژیک...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch(URL, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${API_KEY}`,
                    "HTTP-Referer": "https://hlth3al.github.io/Teacher-AI/",
                    "X-Title": "Teacher-AI",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    model: "meta-llama/llama-3.3-70b-instruct:free",
                    messages: messages
                })
            });

            const data = await response.json();
            document.getElementById(loadingId).remove();

            if (response.ok && data.choices && data.choices.length > 0) {
                const reply = data.choices[0].message.content;
                chatBox.innerHTML += `<div class="message ai">${reply}</div>`;
                messages.push({ role: "assistant", content: reply });
            } else {
                chatBox.innerHTML += `<div class="message ai" style="color:red;">خطا در دریافت پاسخ از هوش مصنوعی.</div>`;
            }
        } catch (error) {
            document.getElementById(loadingId).remove();
            chatBox.innerHTML += `<div class="message ai" style="color:red;">خطای اتصال اینترنت.</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(e) {
        if (e.key === "Enter") {
            sendMessage();
        }
    }
</script>

</body>
</html>
