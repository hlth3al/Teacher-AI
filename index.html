<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher-AI | مرکز فرماندهی یادگیری تطبیقی</title>
  <style>
    :root {
      --bg: #060b14;
      --card: #0d1527;
      --card-hover: #121e36;
      --border: #1e2e4a;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --console-bg: #030712;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); padding: 20px 15px; line-height: 1.6; }
    .container { max-width: 1100px; margin: 0 auto; }
    header { background: linear-gradient(180deg, #0f1c38 0%, #0d1527 100%); border: 1px solid var(--border); border-radius: 14px; padding: 24px; margin-bottom: 20px; }
    .brand-title { font-size: 1.5rem; font-weight: 800; color: #ffffff; }
    .brand-title span { color: var(--accent-cyan); }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .kpi-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .kpi-value { font-size: 1.6rem; font-weight: 800; color: #ffffff; }
    .main-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    @media (max-width: 850px) { .main-grid { grid-template-columns: 1fr; } }
    .panel-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
    .upload-zone { border: 2px dashed var(--border); border-radius: 10px; padding: 25px 15px; text-align: center; cursor: pointer; background: rgba(15, 23, 42, 0.4); margin-bottom: 15px; }
    textarea { width: 100%; min-height: 90px; background: #070d19; border: 1px solid var(--border); border-radius: 8px; padding: 12px; color: #fff; margin-bottom: 15px; }
    .action-btn { width: 100%; background: linear-gradient(90deg, #2563eb, #1d4ed8); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .output-container { flex: 1; background: #070d19; border: 1px solid var(--border); border-radius: 8px; padding: 15px; min-height: 250px; overflow-y: auto; }
    .console-box { background: var(--console-bg); border: 1px solid #111827; border-radius: 10px; padding: 16px; font-family: monospace; }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="brand-title">⚡ Teacher-AI <span>| مرکز فرماندهی یادگیری</span></div>
    <div style="color:var(--text-muted)">پلتفرم استخراج و آزمون‌ساز هوشمند</div>
  </header>
  <div class="kpi-grid">
    <div class="kpi-card"><div class="kpi-value">۹۴.۲ ٪</div><div>پوشش مفهومی سرفصل‌ها</div></div>
    <div class="kpi-card"><div class="kpi-value">۸۸.۵ ٪</div><div>نرخ بازیابی حافظه</div></div>
  </div>
  <div class="main-grid">
    <div class="panel-card">
      <div class="upload-zone" onclick="document.getElementById('fileInput').click()">📷 بارگذاری تصویر کتاب</div>
      <input type="file" id="fileInput" style="display: none;">
      <textarea id="textInput" placeholder="یا متن سوال را تایپ کنید..."></textarea>
      <button class="action-btn" id="execBtn" onclick="runAnalysis()">⚡ اجرای استنتاج شناختی</button>
    </div>
    <div class="panel-card">
      <div class="output-container" id="outputArea">خروجی تحلیل در این قسمت نمایش داده می‌شود...</div>
    </div>
  </div>
  <div class="console-box" id="consoleLogs">لاگ: سیستم آماده است.</div>
</div>

<script>
  function runAnalysis() {
    const outputArea = document.getElementById('outputArea');
    const logs = document.getElementById('consoleLogs');
    const execBtn = document.getElementById('execBtn');

    execBtn.disabled = true;
    execBtn.innerText = "⏳ در حال پردازش...";
    outputArea.innerText = "در حال تحلیل تصویر و استخراج مفاهیم پداگوژیک...";
    logs.innerText = "لاگ: استعلام موتور استنتاج داخلی آغاز شد...";

    // شبیه‌سازی هوشمند پاسخ
    setTimeout(() => {
      outputArea.innerText = "تحلیل هوشمند صفحه: این محتوا شامل مباحث فیزیک پایه و قوانین الکتریسیته است. \n\n۱. سوال تستی پیشنهادی: کدام گزینه در مورد قانون اهم صحیح است؟\n۲. تحلیل مفهومی: ارتباط مستقیم ولتاژ و جریان.\n\n[سیستم آماده است]";
      logs.innerText = "لاگ: تحلیل با موفقیت توسط هسته محلی انجام شد.";
      execBtn.disabled = false;
      execBtn.innerText = "⚡ اجرای استنتاج شناختی";
    }, 2000);
  }
</script>
</body>
</html>
